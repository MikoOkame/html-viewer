<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HTML Viewer</title>
<meta name="description" content="貼って見る。ソースを直すとすぐ反映。">
<meta name="theme-color" content="#151c25">
<meta name="apple-mobile-web-app-title" content="HTML Viewer">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HTML Viewer">
<meta property="og:title" content="HTML Viewer">
<meta property="og:description" content="貼って見る。ソースを直すとすぐ反映。">
<meta property="og:url" content="https://mikookame.github.io/html-viewer/">
<meta property="og:image" content="https://mikookame.github.io/html-viewer/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="HTML Viewer">
<meta name="twitter:description" content="貼って見る。ソースを直すとすぐ反映。">
<meta name="twitter:image" content="https://mikookame.github.io/html-viewer/og.png">
<style>
:root{
  --bg:#0f1419;--bar:#151c25;--text:#f3f6fa;--muted:#8b97a8;
  --btn:#243041;--accent:#7dd3fc;--line:#2d3a4a;
  --bar-h:78px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
  overflow:hidden}
body{padding-top:env(safe-area-inset-top)}
.bar{
  position:fixed;z-index:5;left:0;right:0;top:env(safe-area-inset-top);
  height:var(--bar-h);display:flex;flex-wrap:wrap;align-content:center;gap:2px 0;
  padding:4px 8px 5px;background:var(--bar);border-bottom:1px solid var(--line);
}
.tools{
  display:flex;align-items:center;gap:4px;width:100%;min-width:0;
}
.tools .spacer{flex:1;min-width:0}
#name{
  display:block;width:100%;margin:0;padding:0 4px;
  font-size:.68rem;font-weight:600;line-height:1.2;color:#8b97a8;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
button,.filebtn{
  flex:none;white-space:nowrap;
  min-height:36px;padding:0 8px;border:0;border-radius:10px;
  background:var(--btn);color:var(--text);font:inherit;font-weight:700;font-size:.75rem;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:3px;
}
button.primary,.filebtn.primary{background:var(--accent);color:#082f49}
button.ghost{background:transparent;color:var(--muted)}
button:active,.filebtn:active{filter:brightness(1.12)}
button:disabled{opacity:.35}
button:disabled:active{filter:none}
.filebtn input{display:none}
.icon{width:14px;height:14px;display:block;flex:none}
#undoBtn,#clearBtn{
  min-width:36px;padding:0 8px;background:transparent;color:#c5ced8;font-weight:600;
}
#clearBtn{color:#6b7787}
#fsBtn,#exitFs{min-width:36px}
@media (max-width:400px){
  #fsBtn .label{display:none}
}
.stage{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + var(--bar-h));background:#fff}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:20px;background:var(--bg);color:var(--text);
}
.brand{
  font-size:1.12rem;font-weight:700;letter-spacing:.06em;color:#f3f6fa;
}
.empty-hit{
  width:min(86vw,340px);aspect-ratio:1.15;max-height:46vh;
  border:1px solid #5c6b7c;border-radius:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:var(--muted);background:transparent;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;
}
.empty-hit:active{border-color:#7dd3fc;color:#d7eef9;background:rgba(125,211,252,.06)}
.empty-hit img{width:min(46vw,168px);height:auto;display:block}
.empty-hit span{font-size:.92rem;font-weight:700;letter-spacing:.04em;color:#d5dde6}
.sheet{
  position:fixed;z-index:6;left:0;right:0;bottom:0;
  height:min(52vh,420px);background:#1a222c;border-top:1px solid var(--line);
  transform:translateY(110%);transition:transform .2s ease;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.on{transform:none}
.sheet h2{margin:0;padding:10px 12px;font-size:.75rem;color:var(--muted);font-weight:600}
textarea{
  flex:1;width:100%;border:0;resize:none;padding:12px;
  background:transparent;color:var(--text);
  font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
}
.toast{
  position:fixed;z-index:8;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(80px);opacity:0;
  background:#111827;color:#fff;padding:8px 14px;border-radius:999px;
  font-size:.78rem;font-weight:700;pointer-events:none;transition:.2s ease;
}
.toast.on{transform:translateX(-50%);opacity:1}
#exitFs{
  display:none;position:fixed;z-index:9;
  top:calc(env(safe-area-inset-top) + 8px);
  right:8px;
  height:36px;min-height:36px;padding:0 8px;border-radius:10px;
  background:var(--btn);color:var(--text);border:0;font-weight:700;font-size:.75rem;
}
body.fs{padding-top:0}
body.fs .bar,body.fs .sheet{visibility:hidden;pointer-events:none}
body.fs .stage{top:0}
body.fs #exitFs{display:inline-flex}
.drop-overlay{
  display:none;position:fixed;inset:10px;z-index:20;
  background:rgba(15,20,25,.86);color:var(--accent);
  align-items:center;justify-content:center;flex-direction:column;text-align:center;
  font-size:1.15rem;font-weight:800;pointer-events:none;
  border:2.5px dashed var(--accent);border-radius:22px;
}
body.dragging .drop-overlay{display:flex}
.drop-overlay span{display:block;margin-top:8px;font-size:.8rem;font-weight:600;color:var(--muted)}
body.dragging .empty-hit{
  border-color:var(--accent);color:#d7eef9;background:rgba(125,211,252,.08);
}
</style>
</head>
<body>
<header class="bar">
  <div class="tools">
    <button type="button" id="undoBtn" disabled>Undo</button>
    <button type="button" id="clearBtn" aria-label="消す">消す</button>
    <span class="spacer"></span>
    <button type="button" class="primary" id="paste">貼る</button>
    <label class="filebtn"><input id="file" type="file" accept=".html,.htm,.txt,text/html,text/plain"><span>ファイル</span></label>
    <button type="button" class="ghost" id="srcBtn">ソース</button>
    <button type="button" id="exportBtn" disabled aria-label="HTMLを書き出す">書き出し</button>
    <button type="button" id="fsBtn" aria-label="全画面">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="label">全画面</span>
    </button>
  </div>
  <b id="name">HTML Viewer</b>
</header>
<button type="button" id="exitFs">戻る</button>
<div class="stage" id="stage">
  <iframe id="frame" title="view" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
  <div class="empty" id="empty">
    <div class="brand">HTML Viewer</div>
    <button type="button" class="empty-hit" id="paste2" aria-label="Paste or drop">
      <img src="bird.png" alt="">
      <span>Paste or drop</span>
    </button>
  </div>
</div>
<section class="sheet" id="sheet">
  <h2>ソース（直すとすぐ反映）</h2>
  <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="ここに貼っても表示されます"></textarea>
</section>
<div class="drop-overlay" id="dropOverlay" aria-hidden="true">ここにドロップ<span>HTML / TXT</span></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var src=document.getElementById('src');
  var stage=document.getElementById('stage');
  var frame=document.getElementById('frame');
  var empty=document.getElementById('empty');
  var sheet=document.getElementById('sheet');
  var nameEl=document.getElementById('name');
  var toastEl=document.getElementById('toast');
  var toastTimer=null;
  var fileName='HTML Viewer';
  var lastUrl='';
  var hasContent=false;
  var history=[{text:'',name:fileName}];
  var histAt=0;
  var typedSinceSnap=false;
  var typeTimer=null;
  var DEFAULT_NAME='HTML Viewer';
  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toastEl.classList.remove('on'); }, 1800);
  }
  function nativeFsEl(){
    return document.fullscreenElement||document.webkitFullscreenElement||null;
  }
  function reqFs(el){
    var fn=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen;
    if(!fn) return;
    try{
      var p=fn.call(el);
      if(p&&p.catch) p.catch(function(){});
    }catch(e){}
  }
  function exitNativeFs(){
    var fn=document.exitFullscreen||document.webkitExitFullscreen;
    if(fn&&nativeFsEl()){
      try{ fn.call(document); }catch(e){}
    }
  }
  function enterFS(){
    if(!hasContent){
      toast('先に貼るかファイルを開いてください');
      return;
    }
    sheet.classList.remove('on');
    document.body.classList.add('fs');
    reqFs(document.documentElement);
  }
  function exitFS(){
    document.body.classList.remove('fs');
    exitNativeFs();
  }
  document.addEventListener('fullscreenchange', function(){
    if(!nativeFsEl()) document.body.classList.remove('fs');
  });
  document.addEventListener('webkitfullscreenchange', function(){
    if(!nativeFsEl()) document.body.classList.remove('fs');
  });
  function revokeLater(url){
    if(!url) return;
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 2500);
  }
  function newFrame(){
    var f=document.createElement('iframe');
    f.id='frame';
    f.title='view';
    f.setAttribute('sandbox','allow-scripts allow-forms allow-modals allow-popups');
    stage.insertBefore(f, empty);
    if(frame&&frame.parentNode) frame.parentNode.removeChild(frame);
    frame=f;
    return f;
  }
  function loadHtml(t){
    var f=newFrame();
    var prev=lastUrl;
    lastUrl='';
    try{
      var url=URL.createObjectURL(new Blob([t],{type:'text/html;charset=utf-8'}));
      lastUrl=url;
      f.src=url;
    }catch(e){
      f.srcdoc=t;
    }
    revokeLater(prev);
  }
  function currentSnap(){
    return {text:src.value,name:fileName};
  }
  function sameSnap(a,b){
    return !!a&&!!b&&a.text===b.text&&a.name===b.name;
  }
  function updateUndo(){
    document.getElementById('undoBtn').disabled=histAt<=0;
    document.getElementById('exportBtn').disabled=!hasContent;
  }
  function pushSnap(snap){
    if(sameSnap(history[histAt],snap)) return;
    history=history.slice(0,histAt+1);
    history.push(snap);
    if(history.length>40) history.shift();
    histAt=history.length-1;
    updateUndo();
  }
  function rememberCurrent(){
    clearTimeout(typeTimer);
    clearTimeout(liveTimer);
    if(typedSinceSnap||!sameSnap(history[histAt],currentSnap())) pushSnap(currentSnap());
    typedSinceSnap=false;
  }
  function noteTyping(){
    typedSinceSnap=true;
    clearTimeout(typeTimer);
    typeTimer=setTimeout(function(){
      typedSinceSnap=false;
      typeTimer=null;
      pushSnap(currentSnap());
    },600);
  }
  function paint(text,label,keepSheet){
    if(label){
      fileName=label;
      nameEl.textContent=fileName;
    }
    if(!text||!String(text).trim()){
      src.value='';
      fileName=DEFAULT_NAME;
      nameEl.textContent=fileName;
      hasContent=false;
      newFrame();
      revokeLater(lastUrl);
      lastUrl='';
      empty.style.display='flex';
      if(!keepSheet) sheet.classList.remove('on');
      exitFS();
      updateUndo();
      return;
    }
    src.value=text;
    empty.style.display='none';
    hasContent=true;
    if(!keepSheet) sheet.classList.remove('on');
    loadHtml(text);
    updateUndo();
  }
  function clearAll(){
    rememberCurrent();
    paint('','',false);
    pushSnap(currentSnap());
    toast('空に戻しました');
  }
  function applyView(t, label, keepSheet){
    if(!t || !String(t).trim()){
      if(!keepSheet) clearAll();
      return;
    }
    paint(t,label||fileName,keepSheet);
  }
  function show(text, label){
    rememberCurrent();
    var t=text==null?src.value:text;
    applyView(t, label||fileName||'貼り付け', false);
    pushSnap(currentSnap());
  }
  function undo(){
    rememberCurrent();
    if(histAt<=0){
      toast('戻せる状態がありません');
      return;
    }
    histAt--;
    var snap=history[histAt];
    fileName=snap.name||DEFAULT_NAME;
    paint(snap.text,fileName,true);
    updateUndo();
    toast('Undo');
  }
  function exportName(){
    var n=String(fileName||'').trim();
    if(!/\.html?$/i.test(n)) n='html-viewer.html';
    return n.replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_');
  }
  function saveDownload(file,name){
    var url=URL.createObjectURL(file);
    var a=document.createElement('a');
    a.href=url;
    a.download=name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    toast(name+' を書き出しました');
  }
  function exportHtml(){
    var t=src.value;
    if(!t||!String(t).trim()){
      toast('書き出すHTMLがありません');
      return;
    }
    var name=exportName();
    var file=new File([t],name,{type:'text/html'});
    var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(iOS&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).then(function(){
        toast('書き出しました');
      }).catch(function(err){
        if(err&&err.name==='AbortError') return;
        saveDownload(file,name);
      });
      return;
    }
    saveDownload(file,name);
  }
  var liveTimer=null;
  function liveFromSource(){
    clearTimeout(liveTimer);
    liveTimer=setTimeout(function(){
      var t=src.value;
      if(!t || !t.trim()) return;
      applyView(t, fileName||'ソース', true);
      noteTyping();
    }, 280);
  }
  function readFile(f){
    if(!f) return;
    var ok=/\.(html?|txt)$/i.test(f.name) || /html|text/.test(f.type||'');
    if(!ok){
      toast('HTML / TXT を選んでください');
      return;
    }
    var reader=new FileReader();
    reader.onload=function(){
      show(String(reader.result||''), f.name);
      toast(f.name+' を開きました');
    };
    reader.onerror=function(){ toast('ファイルを読めませんでした'); };
    reader.readAsText(f);
  }
  function fromClipboard(){
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){
        if(!t || !t.trim()){ toast('クリップボードが空です'); return; }
        show(t, '貼り付け');
        toast('貼り付けました');
      }).catch(function(){
        sheet.classList.add('on');
        src.focus();
        toast('長押しで貼り付けてください');
      });
    }else{
      sheet.classList.add('on');
      src.focus();
      toast('長押しで貼り付けてください');
    }
  }
  function clipText(e){
    var d=e.clipboardData;
    if(!d) return '';
    return d.getData('text/plain') || d.getData('text/html') || '';
  }
  document.getElementById('paste').onclick=fromClipboard;
  document.getElementById('paste2').onclick=fromClipboard;
  document.getElementById('undoBtn').onclick=undo;
  document.getElementById('clearBtn').onclick=clearAll;
  document.getElementById('exportBtn').onclick=exportHtml;
  document.getElementById('fsBtn').onclick=enterFS;
  document.getElementById('exitFs').onclick=exitFS;
  src.addEventListener('input', liveFromSource);
  src.addEventListener('change', liveFromSource);
  document.getElementById('srcBtn').onclick=function(){
    if(document.body.classList.contains('fs')) return;
    sheet.classList.toggle('on');
    if(sheet.classList.contains('on')) setTimeout(function(){ src.focus(); }, 50);
  };
  document.getElementById('file').addEventListener('change', function(e){
    readFile(e.target.files && e.target.files[0]);
    e.target.value='';
  });
  document.addEventListener('paste', function(e){
    if(e.target===src){
      rememberCurrent();
      setTimeout(function(){
        applyView(src.value, fileName, true);
        pushSnap(currentSnap());
        toast('貼り付けました');
      }, 0);
      return;
    }
    var t=clipText(e);
    if(!t || !t.trim()) return;
    e.preventDefault();
    show(t, '貼り付け');
    toast('貼り付けました');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') exitFS();
    var meta=e.metaKey||e.ctrlKey;
    if(meta&&(e.key==='z'||e.key==='Z')&&!e.shiftKey){
      if(e.target===src) return;
      e.preventDefault();
      undo();
    }
    if(meta&&(e.key==='s'||e.key==='S')){
      e.preventDefault();
      exportHtml();
    }
  });
  function hasFiles(e){
    var dt=e.dataTransfer;
    if(!dt) return false;
    if(dt.types){
      for(var i=0;i<dt.types.length;i++){
        if(dt.types[i]==='Files') return true;
      }
    }
    return !!(dt.files && dt.files.length);
  }
  var dragDepth=0;
  document.addEventListener('dragenter', function(e){
    if(!hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    document.body.classList.add('dragging');
  });
  document.addEventListener('dragover', function(e){
    if(!hasFiles(e)) return;
    e.preventDefault();
    try{ e.dataTransfer.dropEffect='copy'; }catch(err){}
  });
  document.addEventListener('dragleave', function(e){
    if(!hasFiles(e) && dragDepth===0) return;
    e.preventDefault();
    dragDepth=Math.max(0, dragDepth-1);
    if(dragDepth===0) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', function(e){
    e.preventDefault();
    dragDepth=0;
    document.body.classList.remove('dragging');
    var f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) readFile(f);
  });
  empty.style.display='flex';
  updateUndo();
})();
</script>
</body>
</html>
